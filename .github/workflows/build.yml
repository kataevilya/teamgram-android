name: Build RyzikGram APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Patch server IP and port (91.206.14.113:10443)
        run: |
          find TMessagesProj/ -type f \( -name "*.cpp" -o -name "*.java" \) -exec sed -i -E 's|149\.154\.[0-9]+\.[0-9]+|91.206.14.113|g' {} +
          find TMessagesProj/ -type f \( -name "*.cpp" -o -name "*.java" \) -exec sed -i -E 's|127\.0\.0\.1|91.206.14.113|g' {} +

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RyzikGram-APK
          path: TMessagesProj/build/outputs/apk/debug/*.apk
