name: Build RyzikGram APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Patch server address to bore.pub:35816
        run: |
          find TMessagesProj/ -type f \( -name "*.cpp" -o -name "*.java" \) -exec sed -i -E 's|149\.154\.[0-9]+\.[0-9]+|bore.pub|g' {} +
          find TMessagesProj/ -type f \( -name "*.cpp" -o -name "*.java" \) -exec sed -i -E 's|127\.0\.0\.1|bore.pub|g' {} +
          find TMessagesProj/ -type f \( -name "*.cpp" -o -name "*.java" \) -exec sed -i 's|10443|35816|g' {} +

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatDebug -PabiFilters=arm64-v8a --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RyzikGram-APK
          path: "**/build/outputs/apk/**/*.apk"
